[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino

; 시리얼 모니터 및 업로드 속도
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    ; USB 시리얼 활성화 (디버깅용)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; UI 전용 저발열 기본 클럭(MHz)
    -DUI_CPU_MHZ=80
    ; 기본값: T2-CAN HTTP 모니터용 WiFi STA 활성.
    -DENABLE_WIFI_RADIO=1
    ; PSRAM 활성화 (S3 모델 필수)
    -DBOARD_HAS_PSRAM
    ; 그래픽 라이브러리 설정 (TFT_eSPI 사용 시)
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup206_LilyGo_T_Display_S3.h

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.31
